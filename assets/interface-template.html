if(!settings.noAnimations)(()=>{

 function sprite(draw,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c}
 function shard(g,w,h,c1,c2){

 let ending=false,W=0,H=0,dpr=1,parts=[],last=0,t=0,skip=false,mx=0,my=0,tx=0,ty=0,t0=performance.now();
 const BLOBS=[{fx:.23,fy:.31,px:0,py:1.2,s:.9},{fx:.17,fy:.27,px:2.1,py:.4,s:1.1},{fx:.29,fy:.19,px:4.2,py:2.6,s:.75}];
 function spawn(p,init){
  const z=.3+Math.random()*.7;
  p.z=z;p.x=Math.random()*W;p.y=init?Math.random()*H:H+30;
  p.w=(7+Math.random()*10)*z*Math.max(.8,H/900);
  p.vy=-(14+Math.random()*30)*z;p.vx=3+Math.random()*9;
  p.r=Math.random()*6.283;p.vr=(Math.random()-.5)*2.2;p.ph=Math.random()*6.283;

 function size(){
  dpr=Math.min(devicePixelRatio||1,lowEffects?1:1.5);
  W=introFrame.clientWidth;H=introFrame.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);

 function draw(dt){

})();
